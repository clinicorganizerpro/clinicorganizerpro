<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 620" role="img" aria-labelledby="title desc">
  <title id="title">Clinic Organizer Pro</title>
  <desc id="desc">Logo do sistema Clinic Organizer Pro com ícone de prancheta médica e texto institucional.</desc>

  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b74df"/>
      <stop offset="100%" stop-color="#0056b8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d07f"/>
      <stop offset="100%" stop-color="#00a95d"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00152e" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)" transform="translate(78 92)">
    <rect x="0" y="120" width="132" height="132" rx="16" fill="url(#blueGrad)" opacity="0.95"/>
    <rect x="62" y="58" width="132" height="132" rx="16" fill="url(#blueGrad)" opacity="0.95"/>

    <g transform="translate(72 102)">
      <rect x="0" y="18" width="170" height="182" rx="24" fill="none" stroke="#0056b8" stroke-width="16"/>
      <rect x="40" y="0" width="84" height="34" rx="14" fill="#0056b8"/>
      <circle cx="82" cy="17" r="6" fill="#00152e" opacity="0.55"/>
      <path d="M50 104 L84 138 L150 70" fill="none" stroke="#00c86f" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M124 208 L168 84 C170 77 178 73 185 76 C192 79 196 88 194 96 L168 208 Z" fill="url(#greenGrad)"/>
    </g>
  </g>

  <g transform="translate(360 120)">
    <text x="0" y="154" fill="#005fc7" font-size="138" font-family="Inter, Arial, sans-serif" font-weight="800" letter-spacing="-4">Clinic</text>
    <text x="10" y="244" fill="#00b763" font-size="80" font-family="Inter, Arial, sans-serif" font-weight="800" font-style="italic" letter-spacing="-2">Organizer Pro</text>
    <text x="0" y="378" fill="#005fc7" font-size="76" font-family="Inter, Arial, sans-serif" font-weight="800" letter-spacing="-2">Sistema de Gestão para Clínicas</text>
  </g>
</svg>